name: CI

on:
  push:

permissions:
  contents: read

# A newer push to the same branch cancels the older, still-running CI run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Reuse Next.js build cache between runs (from node_modules/next/dist/docs ci-build-caching guide).
      - uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - run: npm ci

      # Fail on known vulnerabilities in code that ships to the site (dev tools excluded).
      - run: npm audit --omit=dev

      # Same check as the pre-commit hook: typecheck + lint + format.
      - run: npm run check

      - run: npm run build
