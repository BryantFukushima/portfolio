name: CI

on:
  push:

permissions:
  contents: read

# A newer push to the same branch cancels the older, still-running CI run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Reuse Next.js build cache between runs (from node_modules/next/dist/docs ci-build-caching guide).
      - uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - run: npm ci

      # Fail on known vulnerabilities in code that ships to the site (dev tools excluded).
      - run: npm audit --omit=dev

      # Same check as the pre-commit hook: typecheck + lint + format.
      - run: npm run check

      # Unit tests (Vitest): content rules and helpers.
      - run: npm test

      - run: npm run build

      # Browser tests (Playwright) against the production build, in Chromium and WebKit (Safari's
      # engine). The browsers are cached per Playwright version, so they only download when
      # Playwright is upgraded.
      - id: playwright-version
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}-chromium-webkit

      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit

      # A cached browser still needs its system libraries on a fresh runner.
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit

      # A placeholder address, so the contact page's reveal can be tested without the real one.
      - run: npm run test:e2e
        env:
          CONTACT_EMAIL: test@example.com

      # On failure, upload the report (screenshots, traces) to the run's Artifacts.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
